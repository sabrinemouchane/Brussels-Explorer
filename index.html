<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brussels Explorer</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <!-- Leaflet JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<!-- DETAIL MODAL -->
<div id="detailModal" class="modal">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <div id="detailContent">
            <!-- Wordt gevuld met JavaScript -->
        </div>
    </div>
</div>
<body>
<body>
    <!-- HEADER -->
    <header>
        <h1>Brussels Explorer</h1>
    </header>

    <!-- FILTERS & CONTROLS -->
    <section class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Zoek naar locaties...">
        </div>
        
        <div class="filters">
            <select id="sortOptions">
                <option value="name">Sorteer op naam</option>
                <option value="type">Sorteer op type</option>
            </select>
        </div>
    </section>

    <!-- KAART -->
    <div id="map" style="height: 400px; margin-bottom: 20px; border-radius: 10px;"></div>

    <!-- RESULTS -->
    <main id="resultsContainer">
        <p>Loading data...</p>
    </main>

    <!-- FAVORITES SIDEBAR -->
    <aside id="favoritesSidebar">
        <h2>Favorieten</h2>
        <div id="favoritesList">
            <p>Geen favoriet toegevoegd.</p>
        </div>
    </aside>

    <script src="script.js"></script>
</body>
</html>
